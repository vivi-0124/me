<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Shippori+Mincho:wght@600;800&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<title>みんなでセトリふりかえり</title>
<meta name="description" content="ライブのセトリと MC に、ファン仲間とひとつずつコメントできるページを作れます。">
<meta property="og:title" content="みんなでセトリふりかえり">
<meta property="og:description" content="ライブのセトリと MC に、ファン仲間とひとつずつコメントできるページを作れます。">
<meta property="og:type" content="website">
<script type="module" src="/js/home.js"></script>
</head>
<body>
  <header class="hero hero-home">
    <div class="lights" aria-hidden="true"></div>
    <div>
      <div class="date">AFTER THE SHOW</div>
      <h1><small>みんなで</small>セトリふりかえり</h1>
      <p class="lead">ライブのセトリと MC に、ファン仲間とひとつずつコメントできるページを作れます。</p>
      <a class="btn btn-primary" href="/new">＋ ふりかえりページを作る</a>
    </div>
  </header>

  <main>
    <section class="steps">
      <h2 class="section-title">つかいかた</h2>
      <ol>
        <li><b>セトリを貼る</b><span>X やメモに書いたセトリと MC を、そのまま貼るだけ</span></li>
        <li><b>リンクを送る</b><span>LINE や X で、ファン仲間にページのリンクを送る</span></li>
        <li><b>みんなでコメント</b><span>曲や MC ごとに、思い出や感想を書き合える</span></li>
      </ol>
      <p class="howto-note">登録はいりません。ページはリンクを知っている人だけが見られます。</p>
    </section>

    <section id="mine-box" hidden>
      <h2 class="section-title">あなたが作ったページ</h2>
      <ul class="event-list" id="mine"></ul>
    </section>

    <section id="recent-box" hidden>
      <h2 class="section-title">最近見たページ</h2>
      <ul class="event-list" id="recent"></ul>
    </section>
  </main>
</body>
</html>
