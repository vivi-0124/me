<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mermaid-live</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbfbfa;
        --fg: #1b1b19;
        --muted: #6b6b66;
        --line: #e3e3df;
        --card: #ffffff;
        --accent: #3d7a5a;
        --warn: #9a6b1f;
        --error: #a33a2c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --fg: #e9e9e5;
          --muted: #9a9a94;
          --line: #2c2c32;
          --card: #1d1d22;
          --accent: #79c79c;
          --warn: #d8ae62;
          --error: #e0796a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
        flex: none;
      }
      h1 { font-size: 15px; margin: 0; letter-spacing: 0.02em; }
      .kind {
        font-size: 12px;
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--accent);
      }
      .meter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
      .bar { width: 96px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
      .bar > i { display: block; height: 100%; background: var(--accent); width: 0%; transition: width 220ms ease; }
      .reason { font-size: 12px; color: var(--muted); }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
      .dot.live { background: var(--accent); }
      .dot.down { background: var(--error); }
      main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; }
      @media (min-width: 900px) { main.with-source { grid-template-columns: 1fr 320px; } }
      #canvas {
        padding: 24px 16px;
        min-height: 0;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
      }
      /* 縦に長い図が切れないよう、枠に収まるまで縮める。
         mermaid の svg は viewBox を持つので、高さを縛れば比率どおりに縮む。 */
      #canvas svg {
        display: block;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
      }
      .empty { color: var(--muted); font-size: 14px; text-align: center; line-height: 1.8; }
      aside {
        border-top: 1px solid var(--line);
        background: var(--card);
        padding: 12px 14px;
        overflow: auto;
      }
      @media (min-width: 900px) { aside { border-top: none; border-left: 1px solid var(--line); } }
      aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
      pre {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .err { color: var(--error); font-size: 12px; margin-top: 10px; white-space: pre-wrap; }
      footer { padding: 8px 16px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); flex: none; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot" id="dot"></span>
      <h1>mermaid-live</h1>
      <span class="kind" id="kind">—</span>
      <span class="meter"><span class="bar"><i id="bar"></i></span><span id="conf">0.00</span></span>
      <span class="reason" id="reason">接続中…</span>
    </header>
    <main class="with-source">
      <div id="canvas">
        <p class="empty" id="empty">
          Claude が答え始めると、ここに図が出ます。<br />
          いまは待機中です。
        </p>
      </div>
      <aside>
        <h2>mermaid source</h2>
        <pre id="source">—</pre>
        <div class="err" id="err"></div>
      </aside>
    </main>
    <footer id="foot">—</footer>

    <script type="module">
      import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs'

      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
      mermaid.initialize({
        startOnLoad: false,
        theme: dark ? 'dark' : 'neutral',
        securityLevel: 'strict',
        fontFamily: 'ui-sans-serif, system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif',
      })

      const el = (id) => document.getElementById(id)
      let renderSeq = 0
      let lastGood = null

      async function draw(state) {
        el('kind').textContent = state.kind ?? '—'
        el('reason').textContent = state.reason ?? ''
        const confidence = Number(state.confidence ?? 0)
        el('bar').style.width = `${Math.round(Math.max(0, Math.min(1, confidence)) * 100)}%`
        el('conf').textContent = confidence.toFixed(2)
        el('source').textContent = state.mermaid ?? '—'
        el('foot').textContent = [
          state.title ? `題: ${state.title}` : null,
          state.direction ? `向き: ${state.direction}` : null,
          state.jev === false ? 'Jev 無効（規則ベース）' : 'Jev で判定',
          state.final ? '確定' : '途中',
          state.updatedAt ? new Date(state.updatedAt).toLocaleTimeString('ja-JP') : null,
        ]
          .filter(Boolean)
          .join('  ·  ')

        if (!state.mermaid) return

        const seq = ++renderSeq
        try {
          const { svg } = await mermaid.render(`live-${seq}`, state.mermaid)
          if (seq !== renderSeq) return
          el('canvas').innerHTML = svg
          // mermaid は svg に style="max-width: NNNpx" を付ける。
          // それが残ると枠に合わせた縮小が効かないので外す。
          const drawn = el('canvas').querySelector('svg')
          if (drawn !== null) {
            drawn.style.maxWidth = ''
            drawn.removeAttribute('height')
          }
          el('err').textContent = ''
          lastGood = state.mermaid
        } catch (error) {
          // 途中の応答から作った図は壊れていることがある。
          // 直前に描けたものを残したまま、原因だけ脇に出す。
          el('err').textContent = `描画できませんでした:\n${error?.message ?? error}`
          if (lastGood === null) el('canvas').innerHTML = '<p class="empty">まだ描ける図がありません。</p>'
        }
      }

      const source = new EventSource('/events')
      source.onopen = () => {
        el('dot').className = 'dot live'
      }
      source.onerror = () => {
        el('dot').className = 'dot down'
        el('reason').textContent = '再接続中…'
      }
      source.onmessage = (event) => {
        try {
          draw(JSON.parse(event.data))
        } catch {
          /* 壊れた行は捨てる */
        }
      }
    </script>
  </body>
</html>
